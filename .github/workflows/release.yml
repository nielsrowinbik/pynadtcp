name: Release

# On every push to main, semantic-release reads the Conventional Commit messages since
# the last tag. If they call for a release, it sets the version in pyproject.toml and
# pynadtcp/__init__.py, builds the package, updates CHANGELOG.md, commits with [skip ci],
# and creates the tag and GitHub Release. The publish job then uploads the build to PyPI.
#
# The PyPI trusted publisher is configured for this file name (release.yml) and the
# `pypi` environment. Renaming either breaks publishing until PyPI is updated to match.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.dist.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Deploy key allowed to bypass the branch ruleset on main. Without the
          # secret, checkout falls back to GITHUB_TOKEN, which works only while
          # main is unprotected.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install build twine
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/changelog@7.0.0
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release
      # dist/ only exists when semantic-release made a release.
      - name: Check for a new release
        id: dist
        run: |
          if [ -d dist ]; then echo "published=true" >> "$GITHUB_OUTPUT"; else echo "published=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.dist.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pynadtcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
