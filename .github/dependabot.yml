version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]

  # Reads pyproject.toml. The library has no runtime dependencies and the test
  # dependencies are unpinned, so this only opens PRs once something is pinned.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
