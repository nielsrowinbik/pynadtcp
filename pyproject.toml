[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynadtcp"
version = "1.0.0"
description = "Async client library for NAD amplifiers controllable over TCP (e.g. the C338)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Niels Bik" }]
keywords = ["nad", "amplifier", "c338", "home-assistant", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nielsrowinbik/pynadtcp"
Source = "https://github.com/nielsrowinbik/pynadtcp"
Issues = "https://github.com/nielsrowinbik/pynadtcp/issues"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["pynadtcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
